<button mat-raised-button color="primary" routerLink="/create">
  Create Member
</button>
<table mat-table [dataSource]="dataSource" class="mat-shadow-2">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Id</th>
    <td mat-cell *matCellDef="let member">{{ member.id }}</td>
  </ng-container>
  <ng-container matColumnDef="cin">
    <th mat-header-cell *matHeaderCellDef>CIN</th>
    <td mat-cell *matCellDef="let member">{{ member.cin }}</td>
  </ng-container>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let member">{{ member.name }}</td>
  </ng-container>
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let member">{{ member.type }}</td>
  </ng-container>
  <ng-container matColumnDef="createdDate">
    <th mat-header-cell *matHeaderCellDef>Created Date</th>
    <td mat-cell *matCellDef="let member">
      {{ member.createdDate | date:'short' }}
    </td>
  </ng-container>
  <ng-container matColumnDef="5">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let member">
      <mat-icon>edit</mat-icon>
      <mat-icon>delete</mat-icon>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
