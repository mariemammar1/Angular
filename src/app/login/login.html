<section class="login-wrapper">
  <div class="login-card">
    <header class="login-header">
      <div class="brand-badge">
        <mat-icon>science</mat-icon>
      </div>
      <span class="portal-tag">LABORATORY PORTAL</span>
      <h1 class="login-title">Sign in</h1>
      <p class="login-subtitle">Enter your credentials to access your laboratory workspace</p>
    </header>

    @if (errorMessage) {
      <div class="alert-box error" role="alert">
        <mat-icon class="alert-icon">error_outline</mat-icon>
        <span class="alert-text">{{ errorMessage }}</span>
      </div>
    }

    <form class="login-form" (ngSubmit)="login()">
      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email address</mat-label>
          <input
            matInput
            type="email"
            name="email"
            placeholder="e.g. admin@lab.org"
            [(ngModel)]="email"
            required
            autocomplete="email"
          />
          <mat-icon matPrefix class="field-icon">mail_outline</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            name="password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
          <mat-icon matPrefix class="field-icon">lock_outline</mat-icon>
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            class="toggle-visibility"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <button
        type="submit"
        mat-flat-button
        color="primary"
        class="submit-button"
        [disabled]="isLoading"
      >
        <span class="btn-content">
          @if (isLoading) {
            <span class="spinner"></span>
            <span>Signing in...</span>
          } @else {
            <mat-icon>login</mat-icon>
            <span>Sign in</span>
          }
        </span>
      </button>
    </form>

    <footer class="login-footer">
      <div class="security-badge">
        <mat-icon>lock</mat-icon>
        <span>Secured with Firebase Authentication</span>
      </div>
    </footer>
  </div>
</section>
